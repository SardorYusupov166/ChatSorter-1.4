plugins { id 'net.fabricmc.fabric-loom-remap' version '1.14.10' }
version = project.mod_version
group = 'dev.chatsorter'
base { archivesName = 'chatsorter' }
repositories { mavenCentral() }
dependencies {
 minecraft "com.mojang:minecraft:${project.minecraft_version}"
 mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
 modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
 modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }

// Prefer Maven Central for shared Java libraries instead of probing game repositories.
afterEvaluate {
    def central = repositories.find { it.name == 'MavenRepo' }
    if (central != null) { repositories.remove(central); repositories.addFirst(central) }
}
